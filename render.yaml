# Render Blueprint: one free web service that serves the game and runs the online world.
# On render.com: New → Blueprint → pick this repository → Apply.
services:
  - type: web
    name: iron-veil
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build:all
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: "1"
      - key: PVP
        value: "0"
      - key: MAX_PLAYERS
        value: "16"
